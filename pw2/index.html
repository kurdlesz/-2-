<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pets 1280px</title>
  
  <!-- Шрифти Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Стилі CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Шапка (Top Bar 1280px) -->
  <header class="top-bar">
    <div class="logo">
      <img src="assets/Logo.svg" alt="PETWORLD Logo">
      <span>PETWORLD</span>
    </div>
    
    <nav class="top-nav">
      <a href="#" class="nav-link">Sign Up</a>
      <a href="#" class="btn-login">Log in</a>
    </nav>
  </header>

  <!-- Секція Hero (Header + Video 1280px) -->
  <main>
    <section class="hero-section">
      <div class="hero-header">
        <h1 class="hero-title">Pet Store & Beyond</h1>
        <p class="hero-text">
          Feed ingredients directly blended into our super nutritious food, available in a range of delicious flavors delivered to your door.
        </p>
        <a href="#" class="btn-hero">Get Started</a>
      </div>

      <div class="hero-video">
        <div class="video-container">
          <img src="assets/Video.png" alt="Husky dog video preview">
          <button class="play-btn" aria-label="Play video">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <polygon points="5,3 19,12 5,21"></polygon>
            </svg>
          </button>
        </div>
      </div>
    </section>
  </main>

</body>
</html>
