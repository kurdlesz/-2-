<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контакти — Global Adventures Blog</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
</head>
<body>

    <header>
        <h1>📬 Зв'яжіться з нами</h1>
        <p>Маєте запитання, пропозиції або бажаєте поділитися власними історіями? Напишіть нам!</p>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">Головна</a></li>
            <li><a href="tokyo.html">Токіо</a></li>
            <li><a href="seoul.html">Сеул</a></li>
            <li><a href="london.html">Лондон</a></li>
            <li><a href="gallery.html">Галерея</a></li>
            <li><a href="contact.html">Контакти</a></li>
        </ul>
    </nav>

    <main>
        <form action="#" method="post">
            <label for="name">Ваше ім'я:</label>
            <input type="text" id="name" name="name" placeholder="Олександр" required>

            <label for="email">Електронна пошта:</label>
            <input type="email" id="email" name="email" placeholder="example@mail.com" required>

            <label for="subject">Тема повідомлення:</label>
            <input type="text" id="subject" name="subject" placeholder="Питання щодо маршруту">

            <label for="message">Повідомлення:</label>
            <textarea id="message" name="message" rows="5" placeholder="Напишіть ваш текст тут..." required></textarea>

            <button type="submit">Надіслати повідомлення</button>
        </form>
    </main>

    <footer>
        <p>© 2026 Global Adventures Blog | Чекаємо на ваші листи!</p>
    </footer>

</body>
</html>
